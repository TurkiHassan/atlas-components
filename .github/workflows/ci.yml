name: Verify Atlas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chrome for integration tests
        run: npx playwright install --with-deps chrome
      - name: Check types, production build and browser integration
        run: npm run check
      - name: Refresh license inventory
        run: npm run provenance
      - name: Verify distributable in a fresh consumer
        run: npm run test:package
      - name: Preserve verification and installable package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atlas-verification-${{ github.run_number }}
          retention-days: 14
          path: |
            artifacts/*.json
            artifacts/*.tgz
            artifacts/*.log
            test-results/
